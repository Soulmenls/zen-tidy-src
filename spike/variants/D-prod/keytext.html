<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zen Tidy Spike D key (text + CSS mask)</title>
  <link rel="stylesheet" href="key.css">
  <script type="module" src="key.js"></script>
</head>
<body>
  <!-- Experimental alternative: never a type=password field, so Firefox's password manager never sees it.
       Masked with -webkit-text-security (CSS.supports reports true in Zen 1.23.4b / Firefox 158). -->
  <label for="key">Anthropic API key</label>
  <input id="key" class="masked" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
  <button id="save" type="button">Save</button>
  <p><a id="nav" href="next.html">Next page (page-triggered navigation)</a></p>
  <button id="rm" type="button">Remove the key field (DOM removal)</button>
  <p id="status"></p>
</body>
</html>
